# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor
name: React Doctor

on:
  # Scans the PR's changed files and posts a sticky summary comment listing only the new issues introduced relative to the merge base of the target branch.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: millionco/react-doctor@v2
        id: doctor
        with:
          # Block only new error-severity findings in changed files. Existing
          # debt elsewhere in the project does not prevent unrelated PRs.
          blocking: error
          scope: full

      # O score e a contagem aparecem no commit status, mas os diagnósticos
      # não saem no log; imprime cada um para dar para investigar pelo GitHub.
      - name: Print diagnostics
        if: always()
        run: |
          for report in "${RUNNER_TEMP}"/react-doctor-report-*.json; do
            [ -f "$report" ] || continue
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              console.log(`mode=${r.mode} ok=${r.ok}`, JSON.stringify(r.summary));
              if (r.error) console.log("error:", JSON.stringify(r.error));
              const diagnostics = (r.projects ?? []).flatMap((p) => p.diagnostics ?? []);
              for (const d of diagnostics.length ? diagnostics : r.diagnostics ?? []) {
                console.log(`${d.severity} ${d.plugin}/${d.rule} ${d.filePath}:${d.line} - ${d.message}`);
              }
            ' "$report"
          done
